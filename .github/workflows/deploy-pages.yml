name: Build and publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Build Gatsby site
        run: npm run build -- --prefix-paths

      # GitHub Pages must publish the generated site, not the repository root
      # (which contains README.md).
      - name: Verify generated site
        run: test -f public/index.html

      - name: Verify bindrune generator route
        run: test -f public/bindrune_generator/index.html

      - name: Publish public directory to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./public
          force_orphan: true
